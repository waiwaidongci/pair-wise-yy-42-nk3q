<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山火事件指挥与车辆调度</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#17212b}h1{margin-bottom:.2rem}h2{margin-top:2rem;border-bottom:2px solid #d7e0e8;padding-bottom:.3rem}table{border-collapse:collapse;width:100%;margin-top:.5rem;font-size:.9rem}th,td{border:1px solid #d7e0e8;padding:.4rem .6rem;text-align:left}th{background:#f0f4f7}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.45rem .9rem;cursor:pointer}input,select{padding:.4rem;margin:.15rem 0;width:100%;box-sizing:border-box}.row{display:flex;gap:1rem;flex-wrap:wrap}.card{flex:1;min-width:220px;background:#fafbfc;border:1px solid #e2e8ee;border-radius:6px;padding:.8rem}.wait{color:#b7791f}.disp{color:#2f855a}.resch{color:#6b46c1}.muted{color:#6b7280;font-size:.85rem}</style></head><body><h1>山火事件指挥与车辆调度</h1><p class="muted">车辆、火线任务与任务区容量绑定；容量满则排队，一车一时段只接一个有效任务；风向或火线等级变化先释放车辆再重排；重复指令不占车。</p>

<h2>调度台</h2><button onclick="loadConsole()">刷新调度台</button><div class="row"><div class="card"><h3>等待 <span class="wait" id="n-wait">0</span></h3><table id="tbl-wait"><thead><tr><th>派车单</th><th>车</th><th>任务</th><th>任务区</th></tr></thead><tbody></tbody></table></div><div class="card"><h3>已派 <span class="disp" id="n-disp">0</span></h3><table id="tbl-disp"><thead><tr><th>派车单</th><th>车</th><th>任务</th><th>任务区</th></tr></thead><tbody></tbody></table></div><div class="card"><h3>失效重排 <span class="resch" id="n-resch">0</span></h3><table id="tbl-resch"><thead><tr><th>派车单</th><th>车</th><th>任务</th><th>任务区</th><th>原派车单</th></tr></thead><tbody></tbody></table></div></div>

<h2>基础数据</h2><div class="row"><div class="card"><h3>新增车辆</h3><label>呼号</label><input id="v-callsign" placeholder="如 川A·1023"><label>唯一标识(可选,用于幂等)</label><input id="v-ref"><button onclick="createVehicle()">新增车辆</button></div><div class="card"><h3>新增任务区</h3><label>名称</label><input id="a-name" placeholder="如 东线一号区"><label>容量</label><input id="a-cap" type="number" value="2" min="1"><button onclick="createArea()">新增任务区</button></div></div>

<h2>火线任务</h2><div class="card"><label>所属事件ID</label><input id="t-item" type="number" value="1"><label>任务区ID</label><input id="t-area" type="number" value="1"><label>标题</label><input id="t-title" placeholder="如 东线堵截"><div class="row"><div class="card"><label>风向</label><select id="t-wind"><option>N</option><option>NE</option><option>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option></select></div><div class="card"><label>火线等级</label><select id="t-sev"><option>low</option><option>moderate</option><option selected>high</option><option>extreme</option></select></div></div><div class="row"><div class="card"><label>开始(ISO)</label><input id="t-start" value="2026-10-05T08:00:00+00:00"></div><div class="card"><label>结束(ISO)</label><input id="t-end" value="2026-10-05T12:00:00+00:00"></div></div><label>唯一标识(可选)</label><input id="t-ref"><button onclick="createTask()">新增火线任务</button></div>

<h2>派车</h2><div class="card"><label>火线任务ID</label><input id="d-task" type="number" value="1"><label>车辆ID</label><input id="d-veh" type="number" value="1"><label>指令唯一标识(幂等键,可选)</label><input id="d-ref" placeholder="如 D-20261005-001"><button onclick="dispatch()">派车</button><button onclick="reschedule()" style="margin-left:.5rem">重排该任务</button></div>

<h2>输出</h2><pre id="out">使用 X-Actor 与 X-Role 请求头调用接口。</pre>

<script>
const H={'Content-Type':'application/json','X-Actor':'demo','X-Role':'field_commander'};
async function api(path,opts){const r=await fetch(path,{headers:H,...opts});const data=await r.json();if(!r.ok)throw new Error(data.message||data.error||r.status);return data}
function show(o){document.getElementById('out').textContent=JSON.stringify(o,null,2)}
function row(d,extra){return `<tr><td>${d.id}</td><td>${d.callsign||d.vehicle_id}</td><td>${d.task_title||d.task_id}</td><td>${d.area_name||d.area_id}</td>${extra||''}</tr>`}
async function loadConsole(){try{const c=await api('/api/dispatch-console');
document.getElementById('n-wait').textContent=c.waiting.length;document.getElementById('n-disp').textContent=c.dispatched.length;document.getElementById('n-resch').textContent=c.rescheduled.length;
document.querySelector('#tbl-wait tbody').innerHTML=c.waiting.map(d=>row(d)).join('');
document.querySelector('#tbl-disp tbody').innerHTML=c.dispatched.map(d=>row(d)).join('');
document.querySelector('#tbl-resch tbody').innerHTML=c.rescheduled.map(d=>row(d,`<td>${d.rescheduled_from}</td>`)).join('');
}catch(e){show({error:e.message})}}
async function createVehicle(){try{const b={callsign:document.getElementById('v-callsign').value};const r=document.getElementById('v-ref').value;if(r)b.external_ref=r;show(await api('/api/vehicles',{method:'POST',body:JSON.stringify(b)}))}catch(e){show({error:e.message})}}
async function createArea(){try{show(await api('/api/task-areas',{method:'POST',body:JSON.stringify({name:document.getElementById('a-name').value,capacity:parseInt(document.getElementById('a-cap').value,10)})}))}catch(e){show({error:e.message})}}
async function createTask(){try{const b={item_id:parseInt(document.getElementById('t-item').value,10),area_id:parseInt(document.getElementById('t-area').value,10),title:document.getElementById('t-title').value,wind_direction:document.getElementById('t-wind').value,severity:document.getElementById('t-sev').value,start_at:document.getElementById('t-start').value,end_at:document.getElementById('t-end').value};const r=document.getElementById('t-ref').value;if(r)b.external_ref=r;show(await api('/api/fire-tasks',{method:'POST',body:JSON.stringify(b)}))}catch(e){show({error:e.message})}}
async function dispatch(){try{const b={task_id:parseInt(document.getElementById('d-task').value,10),vehicle_id:parseInt(document.getElementById('d-veh').value,10)};const r=document.getElementById('d-ref').value;if(r)b.external_ref=r;show(await api(`/api/fire-tasks/${b.task_id}/dispatches`,{method:'POST',body:JSON.stringify(b)}));loadConsole()}catch(e){show({error:e.message})}}
async function reschedule(){try{const id=parseInt(document.getElementById('d-task').value,10);show(await api(`/api/fire-tasks/${id}/reschedule`,{method:'POST'}));loadConsole()}catch(e){show({error:e.message})}}
loadConsole();
</script></body></html>
